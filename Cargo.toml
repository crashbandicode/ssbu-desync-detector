[package]
name = "ssbu-desync-detector"
version = "0.1.0"
edition = "2021"
publish = false
description = "Skyline plugin for Super Smash Bros. Ultimate 13.0.5 that records what ended an online match and keeps the per-frame evidence a vanilla replay needs to show which console desynced"
license = "MIT"

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
# cdylib only: Cargo skips LTO for a library that is also an rlib. The
# integration test and the examples include `src/model.rs` by path instead.
crate-type = ["cdylib"]

[target.'cfg(target_os = "switch")'.dependencies]
skyline = "=0.6.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Size over speed: the mapped NRO is the game-heap cost (as in the other plugins).
opt-level = "s"
debug = 2
strip = false
lto = true
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }
